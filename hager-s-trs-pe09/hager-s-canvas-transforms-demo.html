<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Canvas Transforms Starter</title>
	<style>
	canvas{
		border:1px solid gray;
	}
	</style>
</head>
<body>
	<canvas width="640" height="480">
		Get a real browser!
	</canvas>
	<script>
		'use strict';

        let ctx = document.querySelector('canvas').getContext('2d');
		let rotation = 0;
        let scale = 0;
        
		loop();
	
		function loop(){
            requestAnimationFrame(loop);
			rotation += 0.05;
            scale += 0.01;

            // background
			ctx.fillStyle = 'yellow'; 
			ctx.fillRect(0,0,640,480);

            // draw a "better" triangle - why is this better? You'll see!
            ctx.save();
            ctx.translate(500,100);
            ctx.rotate(rotation);
            ctx.scale(1.2,1.2);
			ctx.strokeStyle="red";
 			ctx.lineWidth="5";
 			ctx.beginPath();
 			ctx.moveTo(0,-50);
 			ctx.lineTo(50,50);
 			ctx.lineTo(-50,50);
 			ctx.closePath();
 			ctx.stroke();
            ctx.restore();

            drawSquare2(ctx,200,100,100,100,rotation,"purple",0.75);
            drawSquare2(ctx,350,100,100,100,-rotation,"purple",1.0);
            drawSquare2(ctx,500,300,100,100,rotation,"purple",1.25);

            // additional triangle and shape
            drawTriangle(ctx,200,300,50,"blue","red",1.2, 2, rotation)
            drawCircle(ctx,100,100,50,"green","black",3, scale)
	
			// do some transformations?
			ctx.save();
            ctx.translate(100,0);
			ctx.rotate(rotation);
			//ctx.scale(1.2,1.2);
			
			//ctx.save();
			// set a bunch of state attributes
			ctx.shadowOffsetX = 15;
			ctx.shadowOffsetY = 15;
			ctx.shadowColor = "rgba(153,50,204,.6)";
			ctx.shadowBlur = 5;
		
		
			// // draw square with fillRect() convenience method
			// ctx.fillStyle="green";
			// ctx.fillRect(100,100,100,100);
	
            //ctx.restore();

			// // draw square with rect()
			// ctx.fillStyle="blue";
			// ctx.beginPath();
			// ctx.rect(300,100,100,100);
			// ctx.closePath();
			// ctx.fill();
			
			// draw squares with our helper function
			drawSquare1(ctx,100,0,100,100,"orange");
			drawSquare1(ctx,250,0,100,100,"orange");
			drawSquare1(ctx,400,0,100,100,"orange");
		
			// draw a triangle
			ctx.strokeStyle="pink";
			ctx.fillStyle="green";
			ctx.lineWidth="5";
			ctx.beginPath();
			ctx.moveTo(500,100);
			ctx.lineTo(550,200);
			ctx.lineTo(450,200);
			ctx.closePath();
            ctx.fill();
			ctx.stroke();

            ctx.restore();
		}
		

		function drawSquare1(ctx,x,y,width,height,fillStyle){
			ctx.save();
			ctx.fillStyle=fillStyle;
			ctx.fillRect(x,y,width,height);
			ctx.restore();
		}

        function drawSquare2(ctx,x,y,width,height,rotation,fillStyle,scale){
            ctx.save();
            ctx.fillStyle = fillStyle;
            ctx.translate(x,y);
            ctx.rotate(rotation);
            ctx.scale(scale,scale);
            // draw from center
            ctx.fillRect(0-width/2,0-height/2,width,height);
            //ctx.fillRect(0,0,width,height);
            ctx.restore();
        }

        function drawTriangle(ctx, x, y, width, strokeStyle, fillStyle, scale, lineWidth, rotation){
            ctx.save();
            ctx.translate(x,y);
            ctx.rotate(rotation);
            ctx.scale(scale,scale);
			ctx.strokeStyle=strokeStyle;
 			ctx.fillStyle=fillStyle;
 			ctx.lineWidth=lineWidth;
 			ctx.beginPath();
 			ctx.moveTo(0, -width);
			ctx.lineTo(width, width);
			ctx.lineTo(-width, width);
 			ctx.closePath();
            ctx.stroke();
            ctx.fill();
            ctx.restore();
        }

        function drawCircle(ctx, x, y, radius, strokeStyle, fillStyle, lineWidth, scale) {
			ctx.save();
			ctx.strokeStyle = strokeStyle;
			ctx.fillStyle = fillStyle;
			ctx.lineWidth = lineWidth;
            ctx.beginPath();
			ctx.scale(1 + scale % 1, 1 + scale % 1);
			ctx.arc(x, y, radius, 0, Math.PI * 2, true);
			ctx.stroke();
			ctx.fill();
            ctx.closePath();
			ctx.restore();
		}
	</script>
</body>
</html>
