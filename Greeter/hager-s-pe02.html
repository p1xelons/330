<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greeter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
      *{
        font-size:1.5em;
        font-family: "Archivo Black", sans-serif;
    }

      button {
        height: 50px;
        width: 150px;
        font-size: 14pt;
      }

      @media (min-width: 1024px) {
        body {
          background-color: red;
          padding: 100px;
        }
      }

      .text-input {
        display: block;
        margin-top: 10px;
      }
    </style>
    <script>

        const shoutify = (str) => str.toUpperCase();

        const greet = (greeting) => {
            // console.log("working");
            let firstName = document.querySelector("#input-firstname").value.trim();
            let lastName = document.querySelector("#input-lastname").value.trim();
 
            if (!firstName) {
              firstName = "Peter";
            }
            if (!lastName) {
              lastName = "Parker";
            }

            let message = `${greeting} ${firstName} ${lastName}`;

            // check for shout
            const shoutMode = document.querySelector("#shout-mode").checked;
            if (shoutMode) {
              message = shoutify(message);
            }

 
            const output = document.querySelector("#output");
            output.innerHTML = `${message}`;
        }

        const init = () => {
            // 1 - get a reference to the button
            // 2 - add a click event to button that calls a `sayHello` function
            const helloButton = document.querySelector("#btn-hello");
            const goodbyeButton = document.querySelector("#btn-goodbye");
            
            helloButton.onclick = function () {
                greet("Hello");
            };
            
            goodbyeButton.onclick = function () {
                greet("Goodbye");
            };


            const output = document.querySelector("#output");
            output.style.color = "red";
            output.style.backgroundColor = "yellow";
        }
        
        window.onload = init;
    </script>
  </head>
<body>
  <button id="btn-hello">Say Hello</button>
  <button id="btn-goodbye">Say Goodbye</button>
  <label id="shout-wrapper">
      <input type="checkbox" id="shout-mode" /> Shout mode
    </label>
  <input id="input-firstname" placeholder="Type in your first name" />
  <input id="input-lastname" placeholder="Type in your last name" />
  <p id="output">???</p>
</body>

</html>
